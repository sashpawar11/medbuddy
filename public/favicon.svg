<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 -15 295 305" role="img" aria-labelledby="icon-title">
  <title id="icon-title">MedBuddy Icon</title>
  <defs>
    <linearGradient id="iconBlueTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1677E8"/>
      <stop offset="0.52" stop-color="#159BD7"/>
      <stop offset="1" stop-color="#20B9A5"/>
    </linearGradient>
    <linearGradient id="iconPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF5FF"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#iconShadow)">
    <!-- stacked reports -->
    <rect x="32" y="24" width="190" height="235" rx="30" fill="#116FD8" opacity=".9" transform="rotate(-8 32 24)"/>
    <rect x="50" y="12" width="205" height="248" rx="30" fill="url(#iconBlueTeal)" transform="rotate(3 50 12)"/>

    <!-- front report -->
    <path d="M72 25h135l61 61v139c0 16-13 29-29 29H72c-16 0-29-13-29-29V54c0-16 13-29 29-29z" fill="url(#iconPaper)"/>
    <path d="M207 25v51c0 6 5 11 11 11h50" fill="#CFE5FA"/>

    <!-- medical cross -->
    <rect x="82" y="75" width="65" height="20" rx="7" fill="#18B6A4"/>
    <rect x="104.5" y="52.5" width="20" height="65" rx="7" fill="#18B6A4"/>

    <!-- report lines -->
    <rect x="162" y="61" width="57" height="10" rx="5" fill="#9ABFE5"/>
    <rect x="162" y="82" width="72" height="10" rx="5" fill="#9ABFE5"/>
    <rect x="82" y="139" width="154" height="10" rx="5" fill="#A9C9E9"/>
    <rect x="82" y="162" width="112" height="10" rx="5" fill="#A9C9E9"/>

    <!-- supportive buddy swoosh/person -->
    <circle cx="236" cy="198" r="28" fill="#20B9A5"/>
    <path d="M167 230c22-34 55-42 89-25 15 8 27 18 35 30-19 24-51 38-89 38-28 0-52-7-70-20 8-8 19-16 35-23z" fill="url(#iconBlueTeal)"/>
  </g>
</svg>
